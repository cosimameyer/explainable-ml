<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Explainable ML — Library Filter</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root {
    --brand-navy:  #1E3A4C;
    --brand-light: #EBF0F3;
    --brand-mid:   #ADC0CA;
    --brand-muted: #5A7A8A;

    --fresh:   #1a7f37;  /* < 6 months */
    --stale:   #9a6700;  /* 6-18 months */
    --dated:   #bc4c00;  /* 18-36 months */
    --ancient: #cf222e;  /* > 36 months */

    --bg: #ffffff;
    --panel: var(--brand-light);
    --border: #e3e8eb;
    --text: var(--brand-navy);
    --muted: var(--brand-muted);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    font-size: 14px;
  }
  header {
    padding: 32px 40px 24px;
    border-bottom: 1px solid var(--border);
  }
  h1 {
    margin: 0 0 6px;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.3px;
    color: var(--brand-navy);
  }
  .subtitle { color: var(--muted); font-size: 13px; max-width: 720px; }
  .subtitle a { color: var(--brand-navy); text-decoration: none; border-bottom: 1px solid var(--brand-mid); }
  .subtitle a:hover { border-bottom-color: var(--brand-navy); }

  .controls {
    padding: 20px 40px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .control-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }
  .control-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    min-width: 110px;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 11px;
    border-radius: 4px;
    background: transparent;
    border: 1px solid var(--brand-mid);
    color: var(--muted);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    user-select: none;
    transition: all 0.12s ease;
  }
  .chip:hover { border-color: var(--brand-navy); color: var(--brand-navy); }
  .chip i { font-size: 10px; opacity: 0.6; }
  .chip.require {
    background: var(--brand-navy);
    color: #ffffff;
    border-color: var(--brand-navy);
  }
  .chip.require i { opacity: 1; }
  .chip.exclude {
    background: transparent;
    color: var(--ancient);
    border-color: var(--ancient);
  }
  .chip.exclude i { opacity: 1; }

  #search {
    flex: 1;
    min-width: 220px;
    padding: 6px 12px 6px 32px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
  }
  #search:focus { outline: none; border-color: var(--brand-navy); }
  .search-wrap { position: relative; flex: 1; min-width: 220px; display: flex; align-items: center; }
  .search-wrap i {
    position: absolute;
    left: 11px;
    color: var(--muted);
    font-size: 12px;
    pointer-events: none;
  }

  .count {
    padding: 14px 40px;
    color: var(--muted);
    font-size: 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .count strong { color: var(--brand-navy); font-weight: 600; }
  #reset {
    margin-left: auto;
    padding: 4px 10px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--muted);
    cursor: pointer;
    font-size: 11px;
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  #reset:hover { color: var(--brand-navy); border-color: var(--brand-navy); }

  .table-wrap {
    padding: 0 40px 40px;
    overflow-x: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
    font-size: 13px;
  }
  th, td {
    padding: 11px 14px;
    text-align: left;
    vertical-align: middle;
    border-bottom: 1px solid var(--border);
  }
  th {
    position: sticky;
    top: 0;
    background: var(--bg);
    color: var(--muted);
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
    border-bottom: 2px solid var(--border);
  }
  th:hover { color: var(--brand-navy); }
  th .sort-arrow { color: var(--brand-mid); margin-left: 4px; font-size: 10px; }
  th.sorted .sort-arrow { color: var(--brand-navy); }
  tbody tr:hover { background: var(--panel); }
  td code {
    background: transparent;
    padding: 0;
    font-family: "SF Mono", Menlo, Monaco, Consolas, monospace;
    font-size: 13px;
    color: var(--brand-navy);
    font-weight: 600;
  }
  td a {
    color: var(--brand-muted);
    text-decoration: none;
    font-size: 12px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-right: 10px;
  }
  td a:hover { color: var(--brand-navy); }
  td a i { font-size: 11px; }

  .bool i { font-size: 13px; }
  .bool .yes { color: var(--brand-navy); }
  .bool .no { color: var(--brand-mid); }
  .bool { text-align: center; }

  .stars, .updated {
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    font-size: 12px;
  }
  .stars i { color: var(--brand-mid); margin-right: 4px; }
  .updated i { margin-right: 4px; }

  .freshness-fresh   { color: var(--fresh); }
  .freshness-stale   { color: var(--stale); }
  .freshness-dated   { color: var(--dated); }
  .freshness-ancient { color: var(--ancient); }
  .freshness-fresh i, .freshness-stale i, .freshness-dated i, .freshness-ancient i { color: currentColor; }

  .loading { color: var(--brand-mid); font-size: 11px; }

  .col-toggles { display: flex; flex-wrap: wrap; gap: 6px; }

  .known-for {
    color: var(--muted);
    max-width: 340px;
    font-size: 12.5px;
    line-height: 1.45;
  }
  .name-cell { white-space: nowrap; }

  @media (max-width: 900px) {
    header, .controls, .count, .table-wrap { padding-left: 20px; padding-right: 20px; }
    .control-label { min-width: auto; width: 100%; }
    .known-for { max-width: 260px; }
  }

  /* ── Tabs ──────────────────────────────────────────────────────────── */
  .tab-nav {
    display: flex;
    border-bottom: 1px solid var(--border);
    padding: 0 40px;
    background: var(--bg);
  }
  .tab-btn {
    padding: 14px 20px;
    border: none;
    background: transparent;
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    transition: color 0.12s;
  }
  .tab-btn:hover { color: var(--brand-navy); }
  .tab-btn.active { color: var(--brand-navy); border-bottom-color: var(--brand-navy); font-weight: 600; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* ── Guide ─────────────────────────────────────────────────────────── */
  .guide-wrap { max-width: 680px; margin: 48px auto; padding: 0 40px 60px; }
  .guide-breadcrumb {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    font-size: 11px; color: var(--muted); margin-bottom: 32px; min-height: 20px;
  }
  .bc-step {
    color: var(--muted); background: var(--panel);
    padding: 3px 8px; border-radius: 3px; font-size: 11px;
  }
  .bc-sep { color: var(--brand-mid); font-size: 10px; }
  .guide-question {
    font-size: 20px; font-weight: 600; color: var(--brand-navy);
    margin: 0 0 8px; line-height: 1.3;
  }
  .guide-hint { font-size: 12.5px; color: var(--muted); margin: 0 0 28px; }
  .guide-options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 32px; }
  .guide-opt-btn {
    text-align: left; padding: 14px 18px;
    border: 1px solid var(--border); border-radius: 6px;
    background: var(--bg); color: var(--brand-navy);
    font-family: inherit; font-size: 13.5px; cursor: pointer;
    transition: border-color 0.12s, background 0.12s; line-height: 1.4;
  }
  .guide-opt-btn:hover { border-color: var(--brand-navy); background: var(--panel); }
  .guide-nav { display: flex; gap: 10px; }
  .guide-nav-btn {
    padding: 7px 14px; border: 1px solid var(--border); border-radius: 4px;
    background: transparent; color: var(--muted);
    font-family: inherit; font-size: 12px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: color 0.12s, border-color 0.12s;
  }
  .guide-nav-btn:hover { color: var(--brand-navy); border-color: var(--brand-navy); }
  .guide-nav-btn:disabled { opacity: 0.35; cursor: default; }
  .guide-result { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 32px; }
  .guide-result-header { background: var(--brand-navy); color: #fff; padding: 20px 24px; }
  .guide-result-header .r-label {
    font-size: 10px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 1px; opacity: 0.65; margin-bottom: 6px;
  }
  .guide-result-header .r-method { font-size: 18px; font-weight: 600; line-height: 1.3; }
  .guide-result-body { padding: 20px 24px; }
  .guide-result-body .r-desc { font-size: 13.5px; color: var(--muted); margin: 0 0 16px; line-height: 1.55; }
  .guide-result-body .r-note { font-size: 12px; color: var(--dated); margin: 0 0 16px; }
  .guide-result-body .r-libs-label {
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.7px; color: var(--muted); margin-bottom: 10px;
  }
  .guide-lib-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .guide-lib-chip {
    padding: 5px 12px; border: 1px solid var(--brand-mid); border-radius: 4px;
    font-size: 12.5px; font-family: "SF Mono", Menlo, Monaco, Consolas, monospace;
    color: var(--brand-navy); cursor: pointer; background: transparent;
    transition: background 0.12s, border-color 0.12s; text-decoration: none; display: inline-block;
  }
  .guide-lib-chip:hover { background: var(--brand-navy); color: #fff; border-color: var(--brand-navy); }
  .guide-no-lib { font-size: 12.5px; color: var(--muted); font-style: italic; }

  @media (max-width: 900px) {
    .tab-nav { padding: 0 20px; }
    .guide-wrap { padding: 0 20px 40px; margin-top: 32px; }
    .guide-question { font-size: 17px; }
  }
</style>
</head>
<body>

<header>
  <h1>Explainable ML — Python Libraries</h1>
  <div class="subtitle">
    Interactive filter for the curated list in
    <a href="https://github.com/" id="repo-link">explainable-ml</a>.<br>
    Click capability filters (any <i class="fa-solid fa-arrow-right"></i> require <i class="fa-solid fa-arrow-right"></i> exclude).<br>
    <i>Stars and last-commit data fetched from GitHub.</i>
  </div>
</header>

<nav class="tab-nav">
  <button class="tab-btn active" data-tab="tab-libraries">
    <i class="fa-solid fa-table-list"></i> Libraries
  </button>
  <button class="tab-btn" data-tab="tab-guide">
    <i class="fa-regular fa-compass"></i> Decision Guide
  </button>
</nav>

<div id="tab-libraries" class="tab-panel active">
<div class="controls">
  <div class="control-row">
    <span class="control-label">Scope</span>
    <div class="chip-group" data-group="scope"></div>
  </div>
  <div class="control-row">
    <span class="control-label">Data type</span>
    <div class="chip-group" data-group="datatype"></div>
  </div>
  <div class="control-row">
    <span class="control-label">Model type</span>
    <div class="chip-group" data-group="modeltype"></div>
  </div>
  <div class="control-row">
    <span class="control-label">Search</span>
    <div class="search-wrap">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="search" placeholder="Filter by library name or description...">
    </div>
  </div>
  <div class="control-row">
    <span class="control-label">Columns</span>
    <div class="col-toggles" id="col-toggles"></div>
  </div>
</div>

<div class="count">
  <span><strong id="visible-count">0</strong> of <strong id="total-count">0</strong> libraries</span>
  <button id="reset"><i class="fa-solid fa-rotate-left"></i> Reset</button>
</div>

<div class="table-wrap">
  <table id="libs-table">
    <thead><tr id="header-row"></tr></thead>
    <tbody id="body"></tbody>
  </table>
</div>
</div><!-- #tab-libraries -->

<div id="tab-guide" class="tab-panel">
  <div class="guide-wrap">
    <div class="guide-breadcrumb" id="guide-breadcrumb"></div>
    <div id="guide-content"></div>
    <div class="guide-nav">
      <button class="guide-nav-btn" id="guide-back" disabled>
        <i class="fa-solid fa-arrow-left"></i> Back
      </button>
      <button class="guide-nav-btn" id="guide-restart">
        <i class="fa-solid fa-rotate-left"></i> Start over
      </button>
    </div>
  </div>
</div><!-- #tab-guide -->

<script>
const COLUMNS = [
  { key: "name",       label: "Library",     type: "code",       always: true },
  { key: "known_for",  label: "Known for",   type: "text" },
  { key: "link",       label: "Links",       type: "link" },
  { key: "stars",      label: "Stars",       type: "stars" },
  { key: "updated",    label: "Last commit", type: "updated" },
  { key: "global",     label: "Global",      type: "bool", group: "scope" },
  { key: "local",      label: "Local",       type: "bool", group: "scope" },
  { key: "tabular",    label: "Tabular",     type: "bool", group: "datatype" },
  { key: "text",       label: "Text",        type: "bool", group: "datatype" },
  { key: "image",      label: "Image",       type: "bool", group: "datatype" },
  { key: "timeseries", label: "Time series", type: "bool", group: "datatype" },
  { key: "blackbox",   label: "Black-box",   type: "bool", group: "modeltype" },
  { key: "whitebox",   label: "White-box",   type: "bool", group: "modeltype" },
];

let LIBS = [];

// Filter state: 0 = any, 1 = require ✓, 2 = exclude ✗
const filterState = {};
COLUMNS.filter(c => c.type === "bool").forEach(c => filterState[c.key] = 0);

const colVisible = {};
COLUMNS.forEach(c => colVisible[c.key] = true);

let sortKey = "name";
let sortAsc = true;

const ICON_REQ = '<i class="fa-solid fa-check"></i>';
const ICON_EXC = '<i class="fa-solid fa-xmark"></i>';

// Convert a subset of markdown to HTML: [text](url) links and `code` spans.
function mdToHtml(text) {
  // Escape HTML entities first to prevent injection
  let s = text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
  // `code` → <code>code</code>
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  // [text](url) → <a href="url" target="_blank" rel="noopener">text</a>
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}

function chipLabel(col) {
  const s = filterState[col.key];
  if (s === 0) return col.label;
  if (s === 1) return `${ICON_REQ} ${col.label}`;
  return `${ICON_EXC} ${col.label}`;
}

function renderChips() {
  const groups = { scope: [], datatype: [], modeltype: [] };
  COLUMNS.filter(c => c.type === "bool").forEach(c => groups[c.group].push(c));
  Object.keys(groups).forEach(g => {
    const container = document.querySelector(`.chip-group[data-group="${g}"]`);
    container.innerHTML = "";
    groups[g].forEach(col => {
      const chip = document.createElement("div");
      const s = filterState[col.key];
      chip.className = "chip" + (s === 1 ? " require" : s === 2 ? " exclude" : "");
      chip.innerHTML = chipLabel(col);
      chip.onclick = () => {
        filterState[col.key] = (filterState[col.key] + 1) % 3;
        renderChips();
        render();
      };
      container.appendChild(chip);
    });
  });
}

function renderColToggles() {
  const container = document.getElementById("col-toggles");
  container.innerHTML = "";
  COLUMNS.forEach(col => {
    if (col.always) return;
    const chip = document.createElement("div");
    const on = colVisible[col.key];
    chip.className = "chip" + (on ? " require" : "");
    chip.innerHTML = col.label;
    chip.onclick = () => {
      colVisible[col.key] = !colVisible[col.key];
      renderColToggles();
      render();
    };
    container.appendChild(chip);
  });
}

function formatStars(n) {
  if (n == null) return '<span class="loading">—</span>';
  if (n >= 1000) return (n / 1000).toFixed(n >= 10000 ? 0 : 1) + "k";
  return String(n);
}

function freshnessClass(months) {
  if (months == null) return "";
  if (months < 6)  return "freshness-fresh";
  if (months < 18) return "freshness-stale";
  if (months < 36) return "freshness-dated";
  return "freshness-ancient";
}

function freshnessIcon(months) {
  if (months == null) return "fa-circle-notch";
  if (months < 6)  return "fa-circle-check";
  if (months < 18) return "fa-circle-dot";
  if (months < 36) return "fa-triangle-exclamation";
  return "fa-circle-exclamation";
}

function formatAgo(date) {
  if (!date) return '<span class="loading">—</span>';
  const now = new Date();
  const diffMs = now - date;
  const days = Math.floor(diffMs / 86400000);
  const months = days / 30.44;
  let text;
  if (days < 1) text = "today";
  else if (days < 7) text = `${days}d ago`;
  else if (days < 30) text = `${Math.floor(days / 7)}w ago`;
  else if (months < 12) text = `${Math.floor(months)}mo ago`;
  else text = `${(months / 12).toFixed(1)}y ago`;
  const cls = freshnessClass(months);
  const icon = freshnessIcon(months);
  return `<span class="${cls}"><i class="fa-solid ${icon}"></i>${text}</span>`;
}

function renderHeader() {
  const row = document.getElementById("header-row");
  row.innerHTML = "";
  COLUMNS.forEach(col => {
    if (!colVisible[col.key]) return;
    const th = document.createElement("th");
    const sorted = sortKey === col.key;
    const arrow = sorted ? (sortAsc ? '<i class="fa-solid fa-arrow-up sort-arrow"></i>' : '<i class="fa-solid fa-arrow-down sort-arrow"></i>') : "";
    th.innerHTML = col.label + " " + arrow;
    if (sorted) th.classList.add("sorted");
    th.onclick = () => {
      if (sortKey === col.key) sortAsc = !sortAsc;
      else { sortKey = col.key; sortAsc = col.key === "name"; }
      render();
    };
    row.appendChild(th);
  });
}

function renderBody() {
  const q = document.getElementById("search").value.toLowerCase().trim();
  const body = document.getElementById("body");
  body.innerHTML = "";

  const filtered = LIBS.filter(lib => {
    if (q && !(lib.name.toLowerCase().includes(q) || lib.known_for.toLowerCase().includes(q))) return false;
    for (const col of COLUMNS) {
      if (col.type !== "bool") continue;
      const s = filterState[col.key];
      if (s === 1 && !lib[col.key]) return false;
      if (s === 2 && lib[col.key]) return false;
    }
    return true;
  });

  filtered.sort((a, b) => {
    let va, vb;
    if (sortKey === "name") { va = a.name.toLowerCase(); vb = b.name.toLowerCase(); }
    else if (sortKey === "stars") { va = a._stars ?? -1; vb = b._stars ?? -1; }
    else if (sortKey === "updated") { va = a._updated ? a._updated.getTime() : 0; vb = b._updated ? b._updated.getTime() : 0; }
    else { va = a[sortKey]; vb = b[sortKey]; }
    if (va < vb) return sortAsc ? -1 : 1;
    if (va > vb) return sortAsc ? 1 : -1;
    return 0;
  });

  filtered.forEach(lib => {
    const tr = document.createElement("tr");
    COLUMNS.forEach(col => {
      if (!colVisible[col.key]) return;
      const td = document.createElement("td");
      if (col.type === "code") {
        td.className = "name-cell";
        td.innerHTML = `<code>${lib.name}</code>`;
      } else if (col.type === "text") {
        td.className = "known-for";
        td.innerHTML = mdToHtml(lib.known_for);
      } else if (col.type === "link") {
        const parts = [];
        if (lib.repo) parts.push(`<a href="https://github.com/${lib.repo}" target="_blank" rel="noopener"><i class="fa-brands fa-github"></i></a>`);
        if (lib.docs) parts.push(`<a href="${lib.docs}" target="_blank" rel="noopener"><i class="fa-solid fa-book"></i></a>`);
        if (lib.pypi) parts.push(`<a href="${lib.pypi}" target="_blank" rel="noopener"><i class="fa-brands fa-python"></i></a>`);
        td.innerHTML = parts.join("");
      } else if (col.type === "stars") {
        td.className = "stars";
        td.innerHTML = `<i class="fa-solid fa-star"></i>${formatStars(lib._stars)}`;
      } else if (col.type === "updated") {
        td.className = "updated";
        td.innerHTML = formatAgo(lib._updated);
      } else if (col.type === "bool") {
        td.className = "bool";
        td.innerHTML = lib[col.key]
          ? '<i class="fa-solid fa-check yes"></i>'
          : '<i class="fa-solid fa-minus no"></i>';
      }
      tr.appendChild(td);
    });
    body.appendChild(tr);
  });

  document.getElementById("visible-count").textContent = filtered.length;
  document.getElementById("total-count").textContent = LIBS.length;
}

function render() {
  renderHeader();
  renderBody();
}

function reset() {
  Object.keys(filterState).forEach(k => filterState[k] = 0);
  Object.keys(colVisible).forEach(k => colVisible[k] = true);
  document.getElementById("search").value = "";
  renderChips();
  renderColToggles();
  render();
}

document.getElementById("search").addEventListener("input", render);
document.getElementById("reset").addEventListener("click", reset);

// Live-fetch stars and last commit from GitHub API, with localStorage caching
async function loadGitHubData() {
  const CACHE_KEY = "explainable-ml-gh-cache-v1";
  const CACHE_TTL = 6 * 60 * 60 * 1000; // 6 hours
  let cache = {};
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed.ts && (Date.now() - parsed.ts) < CACHE_TTL) cache = parsed.data || {};
    }
  } catch (e) {}

  // Apply cached values immediately
  LIBS.forEach(lib => {
    const c = cache[lib.repo];
    if (c) {
      lib._stars = c.stars;
      lib._updated = c.pushed ? new Date(c.pushed) : null;
    }
  });
  render();

  // Fetch fresh data in background (unauthenticated limit: 60/hr per IP)
  const fresh = {};
  await Promise.all(LIBS.map(async lib => {
    if (!lib.repo) return;
    try {
      const r = await fetch(`https://api.github.com/repos/${lib.repo}`);
      if (!r.ok) return;
      const j = await r.json();
      lib._stars = j.stargazers_count;
      lib._updated = j.pushed_at ? new Date(j.pushed_at) : null;
      fresh[lib.repo] = { stars: j.stargazers_count, pushed: j.pushed_at };
    } catch (e) {}
  }));

  if (Object.keys(fresh).length > 0) {
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), data: { ...cache, ...fresh } }));
    } catch (e) {}
    render();
  }
}

try {
  const host = location.hostname;
  if (host.endsWith(".github.io")) {
    const user = host.split(".")[0];
    const path = location.pathname.split("/").filter(Boolean)[0] || "explainable-ml";
    document.getElementById("repo-link").href = `https://github.com/${user}/${path}`;
  }
} catch (e) {}

async function init() {
  try {
    const r = await fetch("./libraries.json", { cache: "no-cache" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    LIBS = await r.json();
  } catch (e) {
    console.error("Failed to load libraries.json", e);
    document.getElementById("body").innerHTML =
      '<tr><td colspan="99" style="padding:2rem;text-align:center;color:#b00">Could not load libraries.json</td></tr>';
    return;
  }
  document.getElementById("total-count").textContent = LIBS.length;
  renderChips();
  renderColToggles();
  render();
  loadGitHubData();
}

// ── guide runtime ────────────────────────────────────────────────────────────
let guideHistory = [];
let guideCurrent = "START";

function guideStep(nodeId, choiceLabel) {
  guideHistory.push({ id: guideCurrent, label: choiceLabel });
  guideCurrent = nodeId;
  renderguide();
}
function guideBack() {
  if (!guideHistory.length) return;
  guideCurrent = guideHistory.pop().id;
  renderguide();
}
function guideRestart() {
  guideHistory = [];
  guideCurrent = "START";
  renderguide();
}

function renderguide() {
  const node = TREE[guideCurrent];

  // breadcrumb
  const bc = document.getElementById("guide-breadcrumb");
  bc.innerHTML = "";
  guideHistory.forEach((step, i) => {
    if (i > 0) {
      const sep = document.createElement("span");
      sep.className = "bc-sep";
      sep.innerHTML = '<i class="fa-solid fa-chevron-right"></i>';
      bc.appendChild(sep);
    }
    const s = document.createElement("span");
    s.className = "bc-step";
    s.textContent = step.label;
    bc.appendChild(s);
  });

  document.getElementById("guide-back").disabled = guideHistory.length === 0;

  const content = document.getElementById("guide-content");
  content.innerHTML = "";

  if (node.method) {
    // Result
    const libsHtml = node.libs && node.libs.length
      ? node.libs.map(name => {
          const lib = LIBS.find(l => l.name === name);
          const href = lib ? (lib.docs || "#") : "#";
          return `<a class="guide-lib-chip" href="${href}" target="_blank" rel="noopener">${name}</a>`;
        }).join("")
      : `<span class="guide-no-lib">Typically implemented as custom code — no dedicated library</span>`;

    content.innerHTML = `
      <div class="guide-result">
        <div class="guide-result-header">
          <div class="r-label"><i class="fa-solid fa-circle-check"></i> Recommended method</div>
          <div class="r-method">${node.method}</div>
        </div>
        <div class="guide-result-body">
          <p class="r-desc">${node.desc}</p>
          ${node.note ? `<p class="r-note"><i class="fa-solid fa-triangle-exclamation"></i> ${node.note}</p>` : ""}
          ${node.libs && node.libs.length ? `<div class="r-libs-label">Python libraries</div>` : ""}
          <div class="guide-lib-chips">${libsHtml}</div>
        </div>
      </div>`;
  } else {
    // Question
    const q = document.createElement("h2");
    q.className = "guide-question";
    q.textContent = node.q;
    content.appendChild(q);
    if (node.hint) {
      const hint = document.createElement("p");
      hint.className = "guide-hint";
      hint.textContent = node.hint;
      content.appendChild(hint);
    }
    const opts = document.createElement("div");
    opts.className = "guide-options";
    node.opts.forEach(opt => {
      const btn = document.createElement("button");
      btn.className = "guide-opt-btn";
      btn.textContent = opt.label;
      btn.onclick = () => guideStep(opt.next, opt.label);
      opts.appendChild(btn);
    });
    content.appendChild(opts);
  }
}

// Tab switching
document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById(btn.dataset.tab).classList.add("active");
    if (btn.dataset.tab === "tab-guide") renderguide();
  });
});
document.getElementById("guide-back").addEventListener("click", guideBack);
document.getElementById("guide-restart").addEventListener("click", guideRestart);

init();
</script>
