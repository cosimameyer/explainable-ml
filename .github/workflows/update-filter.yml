name: Sync README table from libraries.json

on:
  push:
    branches: [main]
    paths:
      - "docs/libraries.json"
      - "scripts/generate_readme_table.py"
      - ".github/workflows/update-filter.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate README table from libraries.json
        run: python scripts/generate_readme_table.py

      - name: Commit changes if any
        run: |
          if [ -n "$(git status --porcelain README.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: regenerate README table from libraries.json"
            git push
          else
            echo "README.md already up to date."
          fi
