name: Sync README table from libraries.json

on:
  push:
    branches: [main]
    paths:
      - "docs/libraries.json"
      - "scripts/generate_readme_table.py"
      - ".github/workflows/update-filter.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate README table from libraries.json
        run: python scripts/generate_readme_table.py

      - name: Create pull request if README changed
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: regenerate README table from libraries.json"
          branch: chore/regenerate-readme-table
          delete-branch: true
          title: "chore: regenerate README table from libraries.json"
          body: "Automated update of the README table generated from `docs/libraries.json`."
          labels: "automated"

      - name: Auto-merge PR
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.SECRET_WRITE }}
        run: gh pr merge --squash --admin "${{ steps.cpr.outputs.pull-request-number }}" -R ${{ github.repository }}
